[package]
name = "lmstudio-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Passive observer for a local LM Studio instance: live request feed, rolling tok/s, hypothetical frontier-API cost, and hardware telemetry in a TUI."
license = "MIT"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
directories = "6.0.0"
ratatui = "0.30.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "sync", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sysinfo = "0.38.4"
libc = "0.2.186"
